<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<link rel="stylesheet"
	href="https://use.fontawesome.com/releases/v5.4.1/css/all.css">

<link href="https://fonts.googleapis.com/css2?family=Charm:wght@400;700&display=swap"
	rel="stylesheet">

<link rel="stylesheet" th:href="@{/css/header.css}">
	<meta charset="UTF-8">
	<meta http-equiv="x-ua-compatible" content="ie=edge">
	<title>Chi tiết sách</title>

	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="stylesheet"
		href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css">
	<link rel="stylesheet"
		href="https://use.fontawesome.com/releases/v5.4.1/css/all.css">
	<link href="https://fonts.googleapis.com/css2?family=Charm:wght@400;700&display=swap"
      rel="stylesheet">

	<link rel="stylesheet" th:href="@{/css/header.css}">
</head>

<body>

	<div th:insert="comman/header :: header"></div>

	<div class="container my-2">
		<div class="card">
			<div class="card-body">
				<div class="container my-5">
					<div class="col-md-12">
						<div>

							<table class="table table-striped table-responsive-md">

								<thead>
									<tr>
										<th>ISBN</th>
										<th>Thể loại</th>
										<th>Tên sách</th>
										<th>Tác giả</th>
										<th>Nhà xuất bản</th>
										<th>Tên bộ sách</th>
										<th>Mô tả</th>
									</tr>
								</thead>

								<tbody>
									<tr>
										<td th:text="${book.isbn}"></td>
										<td th:text="${book.categories[0].name}"></td>
										<td th:text="${book.name}"></td>
										<td th:text="${book.authors[0].name}"></td>
										<td th:text="${book.publishers[0].name}"></td>
										<td th:text="${book.serialName}"></td>
										<td th:text="${book.description}"></td>
									</tr>
								</tbody>

							</table>

						</div>
					</div>
				</div>
			</div>
		</div>
	</div>

	<div th:insert="comman/footer :: footer"></div>

</body>

</html>
