<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta http-equiv="x-ua-compatible" content="ie=edge">

	<title>Chi tiết tác giả</title>

	<meta name="viewport" content="width=device-width, initial-scale=1">

	<!-- Bootstrap -->
	<link rel="stylesheet"
		href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css">

	<!-- Font Awesome -->
	<link rel="stylesheet"
		href="https://use.fontawesome.com/releases/v5.4.1/css/all.css">

	<!-- Font Charm -->
	<link href="https://fonts.googleapis.com/css2?family=Charm:wght@400;700&display=swap"
		rel="stylesheet">

	<!-- CSS -->
	<link rel="stylesheet" th:href="@{/css/header.css}">
	<link rel="stylesheet" th:href="@{/css/common.css}">

	<style>

		.author-detail-card {
			border: none;
			border-radius: 10px;
			box-shadow: 0 3px 15px rgba(0, 0, 0, 0.08);
		}

		.author-image-wrapper {
			text-align: center;
			padding: 20px;
		}

		.author-image {
			width: 230px;
			height: 290px;

			object-fit: cover;
			object-position: center;

			border-radius: 10px;

			box-shadow: 0 5px 15px rgba(0, 0, 0, 0.18);
		}

		.no-author-image {
			width: 230px;
			height: 290px;

			margin: auto;

			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;

			background: #f1f3f4;

			border: 1px solid #ddd;
			border-radius: 10px;

			color: #999;
		}

		.no-author-image i {
			font-size: 55px;
			margin-bottom: 12px;
		}

		.author-name {
			font-family: 'Charm', cursive;
			font-size: 38px;
			font-weight: 700;

			color: #263238;

			margin-bottom: 25px;
		}

		.author-info-row {
			padding: 12px 0;
			border-bottom: 1px solid #eeeeee;
		}

		.author-info-label {
			font-weight: 600;
			color: #555;
		}

		.author-description {
			color: #333;
			line-height: 1.7;
		}

		.book-item {
			display: inline-block;

			background: #f1f3f4;

			padding: 5px 10px;
			margin: 3px;

			border-radius: 5px;
		}

	</style>

</head>


<body class="page-background authors-bg">


	<!-- HEADER -->

	<div th:insert="comman/header :: header"></div>


	<div class="container my-5">

		<div class="card author-detail-card">

			<div class="card-body p-4">

				<div class="row">


					<!-- ======================== -->
					<!-- ẢNH TÁC GIẢ -->
					<!-- ======================== -->

					<div class="col-md-4 author-image-wrapper">


						<!-- Có ảnh -->

						<img th:if="${author.image != null and !author.image.isEmpty()}"
							th:src="@{'/uploads/authors/' + ${author.image}}"
							th:alt="${author.name}"
							class="author-image">


						<!-- Chưa có ảnh -->

						<div th:if="${author.image == null or author.image.isEmpty()}"
							class="no-author-image">

							<i class="fas fa-user"></i>

							<span>Chưa có ảnh tác giả</span>

						</div>


					</div>


					<!-- ======================== -->
					<!-- THÔNG TIN -->
					<!-- ======================== -->

					<div class="col-md-8">


						<h1 class="author-name"
							th:text="${author.name}">

							Tên tác giả

						</h1>


						<!-- MÔ TẢ -->

						<div class="row author-info-row">

							<div class="col-sm-3 author-info-label">

								Giới thiệu

							</div>

							<div class="col-sm-9 author-description"
								th:text="${author.description}">

								Mô tả tác giả

							</div>

						</div>


						<!-- ======================== -->
						<!-- SÁCH CỦA TÁC GIẢ -->
						<!-- ======================== -->

						<div class="row author-info-row">

							<div class="col-sm-3 author-info-label">

								Tác phẩm

							</div>


							<div class="col-sm-9">


								<!-- Có sách -->

								<div th:if="${author.books != null and !author.books.isEmpty()}">

									<a th:each="book : ${author.books}"
										th:href="@{/book/{id}(id=${book.id})}"
										class="book-item"
										th:text="${book.name}">

										Tên sách

									</a>

								</div>


								<!-- Chưa có sách -->

								<span th:if="${author.books == null or author.books.isEmpty()}"
									class="text-muted">

									Chưa có tác phẩm trong thư viện.

								</span>


							</div>

						</div>


						<!-- ======================== -->
						<!-- QUAY LẠI -->
						<!-- ======================== -->

						<div class="mt-4">

							<a th:href="@{/authors}"
								class="btn btn-info">

								<i class="fas fa-arrow-left"></i>

								Quay lại danh sách

							</a>

						</div>


					</div>


				</div>

			</div>

		</div>

	</div>


	<!-- FOOTER -->

	<div th:insert="comman/footer :: footer"></div>


</body>

</html>
