<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<link rel="stylesheet"
	href="https://use.fontawesome.com/releases/v5.4.1/css/all.css">

<link href="https://fonts.googleapis.com/css2?family=Charm:wght@400;700&display=swap"
	rel="stylesheet">

<link rel="stylesheet" th:href="@{/css/header.css}">
<meta charset="utf-8">
<meta http-equiv="x-ua-compatible" content="ie=edge">
<title>Cập nhật sách</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet"
	href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css">
<link rel="stylesheet"
	href="https://use.fontawesome.com/releases/v5.4.1/css/all.css">
</head>

<body>
	<div th:insert="comman/header :: header"></div>

	<div class="container my-5">
		<h3>Cập nhật sách</h3>

		<div class="card">
			<div class="card-body">
				<div class="col-md-10">

					<form action="#" th:action="@{/update-book/{id}(id=${book.id})}"
						th:object="${book}" method="post">

						<div class="row">

							<div class="form-group col-md-8">
								<label for="isbn" class="col-form-label">ISBN</label>

								<input type="text"
									th:field="*{isbn}"
									class="form-control"
									id="isbn"
									placeholder="Nhập mã ISBN" />

								<span th:if="${#fields.hasErrors('isbn')}"
									th:errors="*{isbn}"></span>
							</div>

							<div class="form-group col-md-8">
								<label for="name" class="col-form-label">Tên sách</label>

								<input type="text"
									th:field="*{name}"
									class="form-control"
									id="name"
									placeholder="Nhập tên sách" />
							</div>

							<div class="form-group col-md-8">
								<label for="serialName" class="col-form-label">
									Tên bộ sách
								</label>

								<input type="text"
									th:field="*{serialName}"
									class="form-control"
									id="serialName"
									placeholder="Nhập tên bộ sách" />
							</div>

							<div class="form-group col-md-8">
								<label for="description" class="col-form-label">Mô tả</label>

								<input type="text"
									th:field="*{description}"
									class="form-control"
									id="description"
									placeholder="Nhập mô tả sách" />
							</div>

							<div class="col-md-6">
								<input type="submit"
									class="btn btn-success"
									value="Cập nhật">
							</div>

						</div>

					</form>

				</div>
			</div>
		</div>
	</div>

	<div th:insert="comman/footer :: footer"></div>
</body>

</html>
