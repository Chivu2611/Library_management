<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<link rel="stylesheet"
	href="https://use.fontawesome.com/releases/v5.4.1/css/all.css">

<link href="https://fonts.googleapis.com/css2?family=Charm:wght@400;700&display=swap"
	rel="stylesheet">

<link rel="stylesheet" th:href="@{/css/header.css}">
    <meta charset="UTF-8">
    <meta http-equiv="x-ua-compatible" content="ie=edge">

    <title>Đăng nhập - Hệ thống Quản lý Thư viện</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>

<body>

<div class="login-page">

    <div class="system-title">
        <h1>HỆ THỐNG QUẢN LÝ THƯ VIỆN</h1>
        <p>Quản lý thư viện nhanh chóng và hiệu quả</p>
    </div>

    <div class="login-card">

        <h2>Đăng nhập</h2>

        <form th:action="@{/login}" method="post">

            <div th:if="${param.error}" class="alert alert-danger">
                Email hoặc mật khẩu không chính xác.
            </div>

            <div th:if="${param.logout}" class="alert alert-info">
                Bạn đã đăng xuất khỏi hệ thống.
            </div>

            <div class="form-group">

                <label for="username">
                    Email
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    class="form-control"
                    placeholder="Nhập địa chỉ email"
                    autofocus="autofocus">

            </div>

            <div class="form-group">

                <label for="password">
                    Mật khẩu
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    class="form-control"
                    placeholder="Nhập mật khẩu">

            </div>

            <button
                type="submit"
                name="login-submit"
                id="login-submit"
                class="login-button">

                Đăng nhập

            </button>

        </form>

    </div>

    <div class="footer-text">
        © 2026 Hệ thống Quản lý Thư viện
    </div>

</div>

</body>

</html>
