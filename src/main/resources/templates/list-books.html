<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
	<meta charset="UTF-8">
	<meta http-equiv="x-ua-compatible" content="ie=edge">

	<title>Quản lý sách</title>

	<meta name="viewport" content="width=device-width, initial-scale=1">

	<!-- Bootstrap -->
	<link rel="stylesheet"
		href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css">

	<!-- Font Awesome -->
	<link rel="stylesheet"
		href="https://use.fontawesome.com/releases/v5.4.1/css/all.css">

	<!-- Font Charm -->
	<link href="https://fonts.googleapis.com/css2?family=Charm:wght@400;700&display=swap"
		rel="stylesheet">

	<!-- CSS -->
	<link rel="stylesheet" th:href="@{/css/header.css}">
	<link rel="stylesheet" th:href="@{/css/common.css}">

	<style>

		/* Ảnh bìa trong bảng */
		.book-thumbnail {
			width: 65px;
			height: 90px;
			object-fit: cover;

			border-radius: 5px;

			box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
		}

		/* Khi sách chưa có ảnh */
		.no-book-thumbnail {
			width: 65px;
			height: 90px;

			display: flex;
			align-items: center;
			justify-content: center;

			margin: auto;

			background: #f1f3f4;

			border: 1px solid #ddd;
			border-radius: 5px;

			color: #999;

			font-size: 24px;
		}

		.book-image-cell {
			width: 90px;
			text-align: center;
			vertical-align: middle !important;
		}

		.table td {
			vertical-align: middle;
		}

	</style>

</head>


<body class="page-background books-bg">


	<!-- HEADER -->

	<div th:insert="comman/header :: header"></div>


	<!-- NỘI DUNG -->

	<div class="container my-2">

		<div th:switch="${books}"
			class="container my-5">


			<!-- ======================== -->
			<!-- CÁC NÚT CHỨC NĂNG -->
			<!-- ======================== -->

			<p class="my-5">

				<!-- Chỉ ADMIN được thêm sách -->

				<a href="/add"
					class="btn btn-dark"
					sec:authorize="hasRole('ADMIN')">

					<i class="fas fa-plus ml-2"></i>
					Thêm sách

				</a>


				&nbsp;&nbsp;


				<!-- USER và ADMIN đều export được -->

				<a href="/export/all-book"
					class="btn btn-info">

					<i class="fas fa-file-csv ml-2"></i>
					Xuất CSV

				</a>

			</p>


			<div class="col-md-12">


				<!-- ======================== -->
				<!-- KHÔNG CÓ DỮ LIỆU -->
				<!-- ======================== -->

				<h2 th:case="null">
					Không có dữ liệu sách!
				</h2>


				<!-- ======================== -->
				<!-- CÓ DỮ LIỆU -->
				<!-- ======================== -->

				<div th:case="*">


					<table class="table table-bordered">

						<thead>

							<tr>

								<th class="text-center">
									Ảnh bìa
								</th>

								<th>ISBN</th>

								<th>Tên sách</th>

								<th>Tên bộ sách</th>

								<th>Mô tả</th>

								<th class="text-center">
									Chi tiết
								</th>

								<th class="text-center"
									sec:authorize="hasRole('ADMIN')">
									Sửa
								</th>

								<th class="text-center"
									sec:authorize="hasRole('ADMIN')">
									Xóa
								</th>

							</tr>

						</thead>


						<tbody>


							<tr th:each="book : ${books}">


								<!-- ======================== -->
								<!-- ẢNH BÌA -->
								<!-- ======================== -->

								<td class="book-image-cell">


									<!-- Có ảnh -->

									<img th:if="${book.coverImage != null and !book.coverImage.isEmpty()}"
										th:src="@{'/uploads/books/' + ${book.coverImage}}"
										class="book-thumbnail"
										th:alt="${book.name}">


									<!-- Chưa có ảnh -->

									<div th:if="${book.coverImage == null or book.coverImage.isEmpty()}"
										class="no-book-thumbnail">

										<i class="fas fa-book"></i>

									</div>


								</td>


								<!-- ISBN -->

								<td th:text="${book.isbn}">
								</td>


								<!-- TÊN SÁCH -->

								<td th:text="${book.name}">
								</td>


								<!-- TÊN BỘ SÁCH -->

								<td th:text="${book.serialName}">
								</td>


								<!-- MÔ TẢ -->

								<td th:text="${book.description}">
								</td>


								<!-- ======================== -->
								<!-- CHI TIẾT -->
								<!-- ======================== -->

								<td class="text-center">

									<a th:href="@{/book/{id}(id=${book.id})}"
										class="btn btn-info">

										<i class="fas fa-info-circle"></i>

									</a>

								</td>


								<!-- ======================== -->
								<!-- SỬA - CHỈ ADMIN -->
								<!-- ======================== -->

								<td class="text-center"
									sec:authorize="hasRole('ADMIN')">

									<a th:href="@{/update/{id}(id=${book.id})}"
										class="btn btn-warning">

										<i class="fas fa-edit"></i>

									</a>

								</td>


								<!-- ======================== -->
								<!-- XÓA - CHỈ ADMIN -->
								<!-- ======================== -->

								<td class="text-center"
									sec:authorize="hasRole('ADMIN')">

									<a th:href="@{/remove-book/{id}(id=${book.id})}"
										class="btn btn-danger">

										<i class="fas fa-trash"></i>

									</a>

								</td>


							</tr>


						</tbody>

					</table>


					<!-- ======================== -->
					<!-- PHÂN TRANG -->
					<!-- ======================== -->

					<div th:if="${books.totalPages > 0}"
						class="pagination"
						th:each="pageNumber : ${pageNumbers}">

						<a th:href="@{/books(size=${books.size}, page=${pageNumber})}"
							th:text="${pageNumber}"
							th:class="${pageNumber == books.number + 1} ? active">
						</a>

					</div>


				</div>

			</div>

		</div>

	</div>


	<!-- FOOTER -->

	<div th:insert="comman/footer :: footer"></div>


</body>

</html>
