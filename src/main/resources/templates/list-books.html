<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<link rel="stylesheet"
	href="https://use.fontawesome.com/releases/v5.4.1/css/all.css">

<link href="https://fonts.googleapis.com/css2?family=Charm:wght@400;700&display=swap"
	rel="stylesheet">

<link rel="stylesheet" th:href="@{/css/header.css}">
	<meta charset="UTF-8">
	<meta http-equiv="x-ua-compatible" content="ie=edge">
	<title>Quản lý sách</title>

	<meta name="viewport" content="width=device-width, initial-scale=1">

	<link rel="stylesheet"
		href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css">

	<link rel="stylesheet"
		href="https://use.fontawesome.com/releases/v5.4.1/css/all.css">
</head>

<body>

	<div th:insert="comman/header :: header"></div>

	<div class="container my-2">

		<div th:switch="${books}" class="container my-5">

			<p class="my-5">

				<a href="/add" class="btn btn-dark">
					<i class="fas fa-plus ml-2"></i>
					Thêm sách
				</a>

				&nbsp;&nbsp;

				<a href="/export/all-book" class="btn btn-info">
					<i class="fas fa-file-csv ml-2"></i>
					Xuất CSV
				</a>

			</p>

			<div class="col-md-12">

				<h2 th:case="null">Không có dữ liệu sách!</h2>

				<div th:case="*">

					<table class="table table-bordered">

						<thead>
							<tr>
								<th>ISBN</th>
								<th>Tên sách</th>
								<th>Tên bộ sách</th>
								<th>Mô tả</th>
								<th>Chi tiết</th>
								<th>Sửa</th>
								<th>Xóa</th>
							</tr>
						</thead>

						<tbody>

							<tr th:each="book : ${books}">

								<td th:text="${book.isbn}"></td>

								<td th:text="${book.name}"></td>

								<td th:text="${book.serialName}"></td>

								<td th:text="${book.description}"></td>

								<td>
									<a th:href="@{/book/{id}(id=${book.id})}"
										class="btn btn-info">
										<i class="fas fa-info-circle"></i>
									</a>
								</td>

								<td>
									<a th:href="@{/update/{id}(id=${book.id})}"
										class="btn btn-warning">
										<i class="fas fa-edit"></i>
									</a>
								</td>

								<td>
									<a th:href="@{/remove-book/{id}(id=${book.id})}"
										class="btn btn-danger">
										<i class="fas fa-trash"></i>
									</a>
								</td>

							</tr>

						</tbody>

					</table>

					<div th:if="${books.totalPages > 0}"
						class="pagination"
						th:each="pageNumber : ${pageNumbers}">

						<a th:href="@{/books(size=${books.size}, page=${pageNumber})}"
							th:text="${pageNumber}"
							th:class="${pageNumber == books.number + 1} ? active">
						</a>

					</div>

				</div>

			</div>

		</div>

	</div>

	<div th:insert="comman/footer :: footer"></div>

</body>

</html>
