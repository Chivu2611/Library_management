<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<link rel="stylesheet"
	href="https://use.fontawesome.com/releases/v5.4.1/css/all.css">

<link href="https://fonts.googleapis.com/css2?family=Charm:wght@400;700&display=swap"
	rel="stylesheet">

<link rel="stylesheet" th:href="@{/css/header.css}">
<meta charset="utf-8">
<meta http-equiv="x-ua-compatible" content="ie=edge">
<title>Cập nhật thể loại</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet"
	href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css">
<link rel="stylesheet"
	href="https://use.fontawesome.com/releases/v5.4.1/css/all.css">
</head>

<body>
	<div th:insert="comman/header :: header"></div>

	<div class="container my-5">
		<h3>Cập nhật thể loại</h3>

		<div class="card">
			<div class="card-body">
				<div class="col-md-10">

					<form action="#"
						th:action="@{/update-category/{id}(id=${category.id})}"
						th:object="${category}" method="post">

						<div class="row">

							<div class="form-group col-md-8">
								<label for="name" class="col-form-label">Tên thể loại</label>

								<input type="text"
									th:field="*{name}"
									class="form-control"
									id="name"
									placeholder="Nhập tên thể loại" />
							</div>

							<div class="col-md-6">
								<input type="submit"
									class="btn btn-success"
									value="Cập nhật">
							</div>

						</div>

					</form>

				</div>
			</div>
		</div>
	</div>

	<div th:insert="comman/footer :: footer"></div>
</body>

</html>
