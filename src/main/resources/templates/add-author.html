<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta http-equiv="x-ua-compatible" content="ie=edge">

    <title>Thêm tác giả</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap -->
    <link rel="stylesheet"
          href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://use.fontawesome.com/releases/v5.4.1/css/all.css">

    <!-- Font Charm -->
    <link href="https://fonts.googleapis.com/css2?family=Charm:wght@400;700&display=swap"
          rel="stylesheet">

    <!-- Header CSS -->
    <link rel="stylesheet" th:href="@{/css/header.css}">

    <script>

        // Kiểm tra các trường bắt buộc
        function validateForm() {

            var isValid = true;

            var inputs =
                document.querySelectorAll('.required-field');

            inputs.forEach(function (input) {

                var error = input.nextElementSibling;

                if (input.value.trim() === '') {

                    isValid = false;

                    if (error) {
                        error.textContent =
                            'Vui lòng không để trống trường này.';
                        error.style.color = 'red';
                    }

                } else {

                    if (error) {
                        error.textContent = '';
                    }
                }
            });

            return isValid;
        }


        // Xem trước ảnh tác giả
        function previewAuthorImage(event) {

            var image =
                document.getElementById('authorPreview');

            if (event.target.files &&
                event.target.files[0]) {

                image.src =
                    URL.createObjectURL(
                        event.target.files[0]
                    );

                image.style.display = 'block';
            }
        }

    </script>

</head>


<body>


<!-- HEADER -->

<div th:insert="comman/header :: header"></div>


<div class="container my-5">

    <h3>Thêm tác giả</h3>


    <div class="card">

        <div class="card-body">

            <div class="col-md-10">


                <form action="#"
                      th:action="@{/add-author}"
                      th:object="${author}"
                      method="post"
                      enctype="multipart/form-data"
                      onsubmit="return validateForm()">


                    <div class="row">


                        <!-- ===================== -->
                        <!-- TÊN TÁC GIẢ -->
                        <!-- ===================== -->

                        <div class="form-group col-md-8">

                            <label for="name"
                                   class="col-form-label">

                                Tên tác giả

                            </label>

                            <input type="text"
                                   th:field="*{name}"
                                   class="form-control required-field"
                                   id="name"
                                   placeholder="Nhập tên tác giả">

                            <span></span>

                        </div>


                        <!-- ===================== -->
                        <!-- MÔ TẢ -->
                        <!-- ===================== -->

                        <div class="form-group col-md-8">

                            <label for="description"
                                   class="col-form-label">

                                Mô tả

                            </label>

                            <input type="text"
                                   th:field="*{description}"
                                   class="form-control required-field"
                                   id="description"
                                   placeholder="Nhập mô tả tác giả">

                            <span></span>

                        </div>


                        <!-- ===================== -->
                        <!-- ẢNH TÁC GIẢ -->
                        <!-- ===================== -->

                        <div class="form-group col-md-8">

                            <label for="imageFile"
                                   class="col-form-label">

                                Ảnh tác giả

                            </label>


                            <input type="file"
                                   name="imageFile"
                                   id="imageFile"
                                   class="form-control-file"
                                   accept="image/*"
                                   onchange="previewAuthorImage(event)">


                            <small class="form-text text-muted">

                                Chọn ảnh JPG, JPEG, PNG hoặc WEBP.

                            </small>


                            <!-- PREVIEW -->

                            <img id="authorPreview"
                                 alt="Xem trước ảnh tác giả"
                                 style="
                                    display: none;
                                    width: 160px;
                                    height: 190px;
                                    object-fit: cover;
                                    object-position: center;
                                    margin-top: 15px;
                                    border-radius: 8px;
                                    border: 1px solid #ddd;
                                    box-shadow: 0 2px 8px rgba(0,0,0,0.12);
                                 ">

                        </div>


                        <!-- ===================== -->
                        <!-- LỖI UPLOAD -->
                        <!-- ===================== -->

                        <div class="col-md-8"
                             th:if="${uploadError != null}">

                            <div class="alert alert-danger"
                                 th:text="${uploadError}">
                            </div>

                        </div>


                        <!-- ===================== -->
                        <!-- SUBMIT -->
                        <!-- ===================== -->

                        <div class="col-md-8 mt-3">

                            <input type="submit"
                                   class="btn btn-success"
                                   value="Thêm tác giả">


                            <a th:href="@{/authors}"
                               class="btn btn-secondary ml-2">

                                Quay lại

                            </a>

                        </div>


                    </div>

                </form>

            </div>

        </div>

    </div>

</div>


<!-- FOOTER -->

<div th:insert="comman/footer :: footer"></div>


</body>

</html>
