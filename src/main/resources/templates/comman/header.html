<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<link rel="stylesheet"
	href="https://use.fontawesome.com/releases/v5.4.1/css/all.css">

<link href="https://fonts.googleapis.com/css2?family=Charm:wght@400;700&display=swap"
	rel="stylesheet">

<link rel="stylesheet" th:href="@{/css/header.css}">
	<meta charset="UTF-8">
	<meta http-equiv="x-ua-compatible" content="ie=edge">
	<title>Thanh điều hướng</title>

	<meta name="viewport" content="width=device-width, initial-scale=1">

	<link rel="stylesheet"
		href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css">

	<link rel="stylesheet" th:href="@{/css/header.css}">
</head>

<body>

	<nav th:fragment="header"
		class="navbar navbar-expand-sm bg-info navbar-light">

		<!-- Tên hệ thống - bấm vào sẽ về Dashboard -->
		<a class="navbar-brand" href="/dashboard">
			Hệ thống Quản lý Thư viện
		</a>

		<button class="navbar-toggler" type="button"
			data-toggle="collapse"
			data-target="#navbarNav">

			<span class="navbar-toggler-icon"></span>
		</button>

		<div class="collapse navbar-collapse" id="navbarNav">

			<ul class="navbar-nav mr-auto">

				<!-- Tổng quan -->
				<li class="nav-item" sec:authorize="isAuthenticated()">
					<a class="nav-link" href="/dashboard">Tổng quan</a>
				</li>

				<!-- Sách -->
				<li class="nav-item" sec:authorize="isAuthenticated()">
					<a class="nav-link" href="/books">Sách</a>
				</li>

				<!-- Tác giả -->
				<li class="nav-item" sec:authorize="isAuthenticated()">
					<a class="nav-link" href="/authors">Tác giả</a>
				</li>

				<!-- Nhà xuất bản -->
				<li class="nav-item" sec:authorize="isAuthenticated()">
					<a class="nav-link" href="/publishers">Nhà xuất bản</a>
				</li>

				<!-- Thể loại -->
				<li class="nav-item" sec:authorize="isAuthenticated()">
					<a class="nav-link" href="/categories">Thể loại</a>
				</li>

			</ul>

			<ul class="navbar-nav">

				<li class="nav-item" sec:authorize="isAuthenticated()">
					<a class="nav-link" th:href="@{/logout}">
						Đăng xuất
					</a>
				</li>

			</ul>

		</div>

	</nav>

</body>
</html>
