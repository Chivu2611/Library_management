<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
	<meta charset="UTF-8">
	<meta http-equiv="x-ua-compatible" content="ie=edge">

	<title>Thanh điều hướng</title>

	<meta name="viewport" content="width=device-width, initial-scale=1">

	<!-- Bootstrap -->
	<link rel="stylesheet"
		href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css">

	<!-- Font Awesome -->
	<link rel="stylesheet"
		href="https://use.fontawesome.com/releases/v5.4.1/css/all.css">

	<!-- Font Charm -->
	<link href="https://fonts.googleapis.com/css2?family=Charm:wght@400;700&display=swap"
		rel="stylesheet">

	<!-- CSS Header -->
	<link rel="stylesheet" th:href="@{/css/header.css}">
</head>

<body>

	<nav th:fragment="header"
		class="navbar navbar-expand-sm bg-info navbar-light">

		<!-- ========================= -->
		<!-- TÊN HỆ THỐNG -->
		<!-- ========================= -->

		<!-- ADMIN: bấm vào sẽ về Dashboard -->
		<a class="navbar-brand"
			href="/dashboard"
			sec:authorize="hasRole('ADMIN')">
			Hệ thống Quản lý Thư viện
		</a>

		<!-- USER: bấm vào sẽ về trang Welcome -->
		<a class="navbar-brand"
			href="/welcome"
			sec:authorize="hasRole('USER')">
			Hệ thống Quản lý Thư viện
		</a>


		<!-- Nút menu khi màn hình nhỏ -->
		<button class="navbar-toggler"
			type="button"
			data-toggle="collapse"
			data-target="#navbarNav">

			<span class="navbar-toggler-icon"></span>

		</button>


		<div class="collapse navbar-collapse" id="navbarNav">

			<ul class="navbar-nav mr-auto">

				<!-- ========================= -->
				<!-- MENU ADMIN -->
				<!-- ========================= -->

				<li class="nav-item"
					sec:authorize="hasRole('ADMIN')">

					<a class="nav-link" href="/dashboard">
						Tổng quan
					</a>

				</li>


				<!-- ========================= -->
				<!-- MENU USER -->
				<!-- ========================= -->

				<li class="nav-item"
					sec:authorize="hasRole('USER')">

					<a class="nav-link" href="/welcome">
						Trang chủ
					</a>

				</li>


				<!-- ========================= -->
				<!-- MENU DÙNG CHUNG -->
				<!-- ========================= -->

				<!-- Sách -->
				<li class="nav-item"
					sec:authorize="isAuthenticated()">

					<a class="nav-link" href="/books">
						Sách
					</a>

				</li>

				<li class="nav-item"
					sec:authorize="hasRole('USER')">

					<a class="nav-link"
					th:href="@{/my-borrows}">

						Sách của tôi

					</a>

				</li>

				<!-- Tác giả -->
				<li class="nav-item"
					sec:authorize="isAuthenticated()">

					<a class="nav-link" href="/authors">
						Tác giả
					</a>

				</li>


				<!-- Nhà xuất bản -->
				<li class="nav-item"
					sec:authorize="isAuthenticated()">

					<a class="nav-link" href="/publishers">
						Nhà xuất bản
					</a>

				</li>


				<!-- Thể loại -->
				<li class="nav-item"
					sec:authorize="isAuthenticated()">

					<a class="nav-link" href="/categories">
						Thể loại
					</a>

				</li>

			</ul>


			<!-- ========================= -->
			<!-- ĐĂNG XUẤT -->
			<!-- ========================= -->

			<ul class="navbar-nav">

				<li class="nav-item"
					sec:authorize="isAuthenticated()">

					<a class="nav-link"
						th:href="@{/logout}">
						Đăng xuất
					</a>

				</li>

			</ul>

		</div>

	</nav>

</body>

</html>
