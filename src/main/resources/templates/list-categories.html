<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
	<meta charset="UTF-8">
	<meta http-equiv="x-ua-compatible" content="ie=edge">

	<title>Danh sách thể loại</title>

	<meta name="viewport" content="width=device-width, initial-scale=1">

	<!-- Bootstrap -->
	<link rel="stylesheet"
		href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css">

	<!-- Font Awesome -->
	<link rel="stylesheet"
		href="https://use.fontawesome.com/releases/v5.4.1/css/all.css">

	<!-- Font Charm -->
	<link href="https://fonts.googleapis.com/css2?family=Charm:wght@400;700&display=swap"
		rel="stylesheet">

	<!-- CSS Header -->
	<link rel="stylesheet" th:href="@{/css/header.css}">

	<!-- CSS nền dùng chung -->
	<link rel="stylesheet" th:href="@{/css/common.css}">

</head>

<body class="page-background categories-bg">

	<!-- HEADER -->
	<div th:insert="comman/header :: header"></div>


	<!-- NỘI DUNG -->
	<div class="container my-2">

		<div th:switch="${categories}" class="container my-5">

			<p class="my-5">

				<a href="/addCategory"
					class="btn btn-dark"
					sec:authorize="hasRole('ADMIN')">
						<i class="fas fa-user-plus ml-2"> Thêm thể loại </i>
					</a>

				&nbsp;&nbsp;

				<a href="/export/all-category" class="btn btn-info">
					<i class="fas fa-file-csv ml-2"></i>
					Xuất CSV
				</a>

			</p>


			<div class="col-md-12">

				<!-- Không có dữ liệu -->
				<h2 th:case="null">
					Không có dữ liệu thể loại!
				</h2>


				<!-- Có dữ liệu -->
				<div th:case="*">

					<table class="table table-bordered">

						<thead>
							<tr>
								<th>Tên thể loại</th>
								<th sec:authorize="hasRole('ADMIN')">Sửa</th>
								<th sec:authorize="hasRole('ADMIN')">Xóa</th>
							</tr>
						</thead>

						<tbody>

							<tr th:each="category : ${categories}">

								<td th:text="${category.name}"></td>

								<!-- Sửa -->
								<td sec:authorize="hasRole('ADMIN')">
									<a th:href="@{/updateCategory/{id}(id=${category.id})}"
									class="btn btn-warning">
										<i class="fas fa-user-edit ml-2"></i>
									</a>
								</td>

								<td sec:authorize="hasRole('ADMIN')">
									<a th:href="@{/remove-category/{id}(id=${category.id})}"
									class="btn btn-danger">
										<i class="fas fa-user-times ml-2"></i>
									</a>
								</td>

							</tr>

						</tbody>

					</table>

				</div>

			</div>

		</div>

	</div>


	<!-- FOOTER -->
	<div th:insert="comman/footer :: footer"></div>

</body>

</html>
