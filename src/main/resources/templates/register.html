<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Đăng ký tài khoản</title>

    <link rel="stylesheet"
          href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css">
</head>

<body>

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-5">

            <div class="card">

                <div class="card-body">

                    <h3 class="text-center mb-4">
                        Đăng ký tài khoản
                    </h3>

                    <div th:if="${error}"
                         class="alert alert-danger"
                         th:text="${error}">
                    </div>

                    <form th:action="@{/register}"
                          th:object="${user}"
                          method="post">

                        <div class="form-group">
                            <label>Họ</label>

                            <input type="text"
                                   th:field="*{lastName}"
                                   class="form-control"
                                   required>
                        </div>

                        <div class="form-group">
                            <label>Tên</label>

                            <input type="text"
                                   th:field="*{firstName}"
                                   class="form-control"
                                   required>
                        </div>

                        <div class="form-group">
                            <label>Email</label>

                            <input type="email"
                                   th:field="*{email}"
                                   class="form-control"
                                   required>
                        </div>

                        <div class="form-group">
                            <label>Mật khẩu</label>

                            <input type="password"
                                   th:field="*{password}"
                                   class="form-control"
                                   required>
                        </div>

                        <button type="submit"
                                class="btn btn-info btn-block">
                            Đăng ký
                        </button>

                    </form>

                    <div class="text-center mt-3">

                        <a th:href="@{/login}">
                            Đã có tài khoản? Đăng nhập
                        </a>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
