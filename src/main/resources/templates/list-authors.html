<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
	<meta charset="UTF-8">
	<meta http-equiv="x-ua-compatible" content="ie=edge">

	<title>Danh sách tác giả</title>

	<meta name="viewport" content="width=device-width, initial-scale=1">

	<!-- Bootstrap -->
	<link rel="stylesheet"
		href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css">

	<!-- Font Awesome -->
	<link rel="stylesheet"
		href="https://use.fontawesome.com/releases/v5.4.1/css/all.css">

	<!-- Font Charm -->
	<link href="https://fonts.googleapis.com/css2?family=Charm:wght@400;700&display=swap"
		rel="stylesheet">

	<!-- CSS -->
	<link rel="stylesheet" th:href="@{/css/header.css}">
	<link rel="stylesheet" th:href="@{/css/common.css}">

	<style>

		/* Ảnh tác giả */
		.author-thumbnail {
			width: 75px;
			height: 90px;
			object-fit: cover;
			object-position: center;

			border-radius: 7px;

			box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
		}


		/* Khi chưa có ảnh */
		.no-author-thumbnail {
			width: 75px;
			height: 90px;

			display: flex;
			align-items: center;
			justify-content: center;

			margin: auto;

			background: #f1f3f4;

			border: 1px solid #ddd;
			border-radius: 7px;

			color: #999;

			font-size: 27px;
		}


		.author-image-cell {
			width: 100px;
			text-align: center;
			vertical-align: middle !important;
		}


		.table td {
			vertical-align: middle;
		}


		.action-cell {
			width: 80px;
			text-align: center;
		}

	</style>

</head>


<body class="page-background authors-bg">


	<!-- HEADER -->

	<div th:insert="comman/header :: header"></div>


	<!-- NỘI DUNG -->

	<div class="container my-2">

		<div th:switch="${authors}"
			class="container my-5">


			<!-- ======================= -->
			<!-- NÚT CHỨC NĂNG -->
			<!-- ======================= -->

			<p class="my-5">


				<!-- Chỉ ADMIN -->

				<a href="/addAuthor"
					class="btn btn-dark"
					sec:authorize="hasRole('ADMIN')">

					<i class="fas fa-user-plus"></i>
					Thêm tác giả

				</a>


				&nbsp;&nbsp;


				<!-- ADMIN và USER -->

				<a href="/export/all-author"
					class="btn btn-info">

					<i class="fas fa-file-csv"></i>
					Xuất CSV

				</a>


			</p>


			<div class="col-md-12">


				<!-- ======================= -->
				<!-- KHÔNG CÓ DỮ LIỆU -->
				<!-- ======================= -->

				<h2 th:case="null">
					Không có dữ liệu tác giả!
				</h2>


				<!-- ======================= -->
				<!-- CÓ DỮ LIỆU -->
				<!-- ======================= -->

				<div th:case="*">


					<table class="table table-bordered">


						<thead>

							<tr>

								<th class="text-center">
									Ảnh
								</th>

								<th>
									Tên tác giả
								</th>

								<th>
									Mô tả
								</th>

								<th class="text-center">
									Chi tiết
								</th>

								<th class="text-center"
									sec:authorize="hasRole('ADMIN')">
									Sửa
								</th>

								<th class="text-center"
									sec:authorize="hasRole('ADMIN')">
									Xóa
								</th>

							</tr>

						</thead>


						<tbody>


							<tr th:each="author : ${authors}">


								<!-- ======================= -->
								<!-- ẢNH TÁC GIẢ -->
								<!-- ======================= -->

								<td class="author-image-cell">


									<!-- Có ảnh -->

									<img th:if="${author.image != null and !author.image.isEmpty()}"
										th:src="@{'/uploads/authors/' + ${author.image}}"
										th:alt="${author.name}"
										class="author-thumbnail">


									<!-- Chưa có ảnh -->

									<div th:if="${author.image == null or author.image.isEmpty()}"
										class="no-author-thumbnail">

										<i class="fas fa-user"></i>

									</div>


								</td>


								<!-- ======================= -->
								<!-- TÊN -->
								<!-- ======================= -->

								<td th:text="${author.name}">
								</td>


								<!-- ======================= -->
								<!-- MÔ TẢ -->
								<!-- ======================= -->

								<td th:text="${author.description}">
								</td>


								<!-- ======================= -->
								<!-- CHI TIẾT -->
								<!-- ======================= -->

								<td class="action-cell">

									<a th:href="@{/author/{id}(id=${author.id})}"
										class="btn btn-info">

										<i class="fas fa-info-circle"></i>

									</a>

								</td>


								<!-- ======================= -->
								<!-- SỬA - ADMIN -->
								<!-- ======================= -->

								<td class="action-cell"
									sec:authorize="hasRole('ADMIN')">

									<a th:href="@{/updateAuthor/{id}(id=${author.id})}"
										class="btn btn-warning">

										<i class="fas fa-user-edit"></i>

									</a>

								</td>


								<!-- ======================= -->
								<!-- XÓA - ADMIN -->
								<!-- ======================= -->

								<td class="action-cell"
									sec:authorize="hasRole('ADMIN')">

									<a th:href="@{/remove-author/{id}(id=${author.id})}"
										class="btn btn-danger">

										<i class="fas fa-user-times"></i>

									</a>

								</td>


							</tr>


						</tbody>

					</table>


					<!-- ======================= -->
					<!-- PHÂN TRANG -->
					<!-- ======================= -->

					<div th:if="${authors.totalPages > 0}"
						class="pagination"
						th:each="pageNumber : ${pageNumbers}">

						<a th:href="@{/authors(size=${authors.size}, page=${pageNumber})}"
							th:text="${pageNumber}"
							th:class="${pageNumber == authors.number + 1} ? active">
						</a>

					</div>


				</div>

			</div>

		</div>

	</div>


	<!-- FOOTER -->

	<div th:insert="comman/footer :: footer"></div>


</body>

</html>
